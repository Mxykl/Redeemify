name: Redeemify
version: '${project.version}'
main: de.michaelbrauer.redeemify.Redeemify
# Für 1.20.x Kompatibilität
api-version: '1.20'
author: Michael Brauer (Mxykl)
description: A Paper plugin for redeeming codes with rewards
website: https://github.com/Mxykl/Redeemify

commands:
  redeem:
    description: Redeem a code for rewards
    usage: /redeem <code>
    permission: redeemify.redeem
  redeemify:
    description: Main plugin command for administration
    usage: /redeemify <reload|info>
    permission: redeemify.admin
    aliases: [rd]
  redeemgui:
    description: Open the redemption GUI
    usage: /redeemgui [admin]
    permission: redeemify.gui
    aliases: [rgui, redeem-gui]
  language:
    description: Change your language preference
    usage: /language [language_code]
    permission: redeemify.language
    aliases: [lang, setlang]

permissions:
  redeemify.redeem:
    description: Allows players to redeem codes
    default: true
  redeemify.gui:
    description: Allows players to use the GUI
    default: true
  redeemify.language:
    description: Allows players to change their language
    default: true
  redeemify.notifications:
    description: Receive notifications about new codes
    default: true
  redeemify.admin:
    description: Allows access to admin commands
    default: op
  redeemify.*:
    description: Gives access to all Redeemify permissions
    default: op
    children:
      redeemify.redeem: true
      redeemify.gui: true
      redeemify.language: true
      redeemify.notifications: true
      redeemify.admin: true