# Redeemify Configuration
# Plugin by Michael Brauer (Mxykl)

# General plugin settings
settings:
  # Enable debug messages
  debug: false
  
  # Auto-save interval in minutes (set to 0 to disable)
  auto-save-interval: 5
  
  # Date format for expiration dates (used in codes.yml)
  date-format: "yyyy-MM-dd HH:mm"

# Database settings (for future use)
database:
  # Database type: file, mysql, sqlite
  type: file
  
  # MySQL settings (if type is mysql)
  mysql:
    host: localhost
    port: 3306
    database: redeemify
    username: root
    password: ""
    
# Performance settings
performance:
  # Cache size for frequently accessed data
  cache-size: 1000
  
  # Enable async data saving
  async-save: true